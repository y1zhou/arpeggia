[package]
name = "arpeggia"
version = "0.9.0"
description = "A port of the Arpeggio library for Rust"
edition = "2024"
authors = ["Yi Zhou <me@y1zhou.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "arpeggia"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "arpeggia"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
nalgebra = "0.35"
pdbtbx = { version = "0.12.0", features = ["rayon", "rstar"] }
polars = { version = "0.55.2", default-features = false, features = [
    "json",
    "performant"
] }
polars-io = { version = "0.55.2", default-features = false, features = ["parquet"] }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
pyo3-polars = { version = "0.28", default-features = false, features = [
    "derive",
], optional = true }
rayon = "1.12.0"
rstar = "0.12.2"
rust-sasa = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[features]
default = []
python = ["pyo3", "pyo3-polars", "polars/object"]
