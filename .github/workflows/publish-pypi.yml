name: "pypi"

on:
  release:
    types: [released]
  workflow_dispatch: # manual trigger

jobs:
  # Adapted from pydantic/pydantic-core
  build:
    name: build on ${{ matrix.platform.os }} / ${{ matrix.interpreter }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { os: linux, runs-on: ubuntu-latest },
            { os: linux_aarch64, runs-on: ubuntu-24.04-arm },
            { os: windows, runs-on: windows-latest },
            { os: macos, runs-on: macos-latest },
          ]
        interpreter: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        target: [x86_64, aarch64]

        exclude:
          - platform:
              os: linux_aarch64
            target: x86_64
          - platform:
              os: linux
            target: aarch64
          - platform:
              os: windows
            target: aarch64
          - platform:
              os: macos
            target: x86_64 # too slow on GitHub runners

    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.interpreter }}
          activate-environment: true
          venv-path: ${{ runner.temp }}/wheel-test
          ignore-nothing-to-cache: true
          ignore-empty-workdir: true

      - name: Install Rust stable
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          components: llvm-tools
          toolchain: stable

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          manylinux: auto
          target: ${{ matrix.target }}
          args: >
            --release
            --out dist
            --features python
            --locked
            --interpreter ${{ matrix.interpreter }}
          rust-toolchain: ${{ steps.rust-toolchain.outputs.name }}
          docker-options: -e CI

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          uv pip install dist/*.whl
          uv run --active --no-sync python python/tests/smoke_wheel.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi_files_${{ matrix.platform.os }}_${{ matrix.target }}_${{ matrix.interpreter }}
          path: dist

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: get dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files_*
          merge-multiple: true
          path: dist

      - name: Publish
        run: uv publish --trusted-publishing always
